name: HKI Decoupled CI Pipeline

on:
  push:
    branches: [ "feat/penelitian-skripsi" ]
  pull_request:
    branches: [ "feat/penelitian-skripsi" ]

jobs:
  test-and-validate:
    name: Forensic Code Testing
    runs-on: ubuntu-latest
    
    # 1. ORKESTRASI INFRASTRUKTUR BAYANGAN
    # GitHub akan menyalakan kontainer RabbitMQ, Redis, dan MySQL kosong 
    # khusus untuk durasi pengujian ini, lalu menghancurkannya.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hki_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      # 2. KLONING REPOSITORI
      - name: Checkout Code
        uses: actions/checkout@v3

      # 3. PERSIAPAN LINGKUNGAN PHP
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP skripsi Anda
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, redis, sockets
          coverage: none

      # 4. INSTALASI DEPENDENSI (Keras dan Senyap)
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 5. INISIALISASI APLIKASI
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 6. EKSEKUSI PENGUJIAN MUTLAK
      - name: Execute PHPUnit / Pest Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hki_db
          DB_USERNAME: hki_user
          DB_PASSWORD: hki_password
          QUEUE_CONNECTION: rabbitmq
          RABBITMQ_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: |
          php artisan migrate --force
          php artisan test